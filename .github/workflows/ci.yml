name: ci

# Enterprise CI gate for egl-utils-go, generated by EADOS.
# Implements the quality bar in AGENTS.md §10 across the toolchain matrix from the
# language profile. The build/test/format/lint commands come from project.yaml; the
# setup steps and language-specific extra jobs come from the profile.

on:
  pull_request:
  push:
    branches: [master]
  workflow_call:

# The workflow itself grants nothing. Every job below declares the scope it needs, so a
# job added later cannot silently inherit a token nobody sized for it — which is the
# defect this repository actually had, in release.yml (ADR-0056).
permissions: {}

# Cancel superseded runs on a PR; never cancel a run on master (its history matters).
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  # ---------------------------------------------------------------------------
  # Cross-platform build + test matrix (from the language profile).
  # ---------------------------------------------------------------------------
  build:
    name: build / ${{ matrix.os }} / ${{ matrix.toolchain }} / ${{ matrix.preset }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    permissions:
      contents: read
    strategy:
      fail-fast: false
      # The full cross product of both toolchains and all three platforms, which
      # is what AGENTS.md §10 requires ("Linux / Windows / macOS on Go 1.25 &
      # 1.26 — every CI cell green") and what README.md, CONTRIBUTING.md and
      # docs/development/local-build.md all tell a consumer is verified.
      #
      # The two 1.25 non-Linux cells are the ones this matrix used to omit, and
      # they are the least skippable of the six: 1.25 is the go.mod language
      # floor, so it is the version a conservative consumer is most likely to be
      # on, and the platform half is where this project has actually been bitten
      # — ADR-0050 records a change that passed locally, on Linux and on macOS
      # and failed only the windows-2022 cell. A promise of support is a
      # commitment, and the cell most likely to break was the one with no
      # evidence behind it.
      matrix:
        include:
          - { os: ubuntu-24.04, toolchain: go-1.25, preset: test }
          - { os: ubuntu-24.04, toolchain: go-1.26, preset: test }
          - { os: windows-2022, toolchain: go-1.25, preset: test }
          - { os: windows-2022, toolchain: go-1.26, preset: test }
          - { os: macos-14, toolchain: go-1.25, preset: test }
          - { os: macos-14, toolchain: go-1.26, preset: test }
    steps:
      - name: Check out the source tree
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: ${{ matrix.toolchain == 'go-1.25' && '1.25' || '1.26' }}
          cache: true

      - name: Build
        shell: bash
        run: go build ./...

      - name: Test
        shell: bash
        run: go test ./...

  # ---------------------------------------------------------------------------
  # Cross-artifact congruence — the agent-runnable consistency lint.
  # ---------------------------------------------------------------------------
  consistency:
    name: consistency / lint
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0          # i18n/version checks need full history
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.12'
      - name: Run the consistency lint
        run: python tools/consistency_lint.py

  # ---------------------------------------------------------------------------
  # Language-specific quality jobs (format, lint, sanitizers, …) from the profile.
  # ---------------------------------------------------------------------------
  quality:
    name: quality / lint + race + vuln
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with: { go-version: '1.26', cache: true }
      - name: gofumpt
        run: go install mvdan.cc/gofumpt@v0.10.0 && test -z "$(gofumpt -l .)"
      - uses: golangci/golangci-lint-action@ba0d7d2ec06a0ea1cb5fa41b2e4a3ab91d21278a # v9.3.0
      - name: race + vuln
        run: |
          go test -race ./...
          go install golang.org/x/vuln/cmd/govulncheck@v1.4.0 && govulncheck ./...

  # Reproducible performance gate — runs only when the project has a benchmark suite.
  benchmark:
    name: benchmark / reproducible perf
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          # A literal, because this job has no matrix. It previously read
          # `matrix.toolchain == 'go-1.25' && '1.25' || '1.26'`, copied from the build
          # job, where `matrix` is undefined and the expression silently resolved to
          # '1.26' — a selector that only looked like one (roadmap 14.6 → 14.7).
          go-version: '1.26'
          cache: true
      - name: Run the benchmark suite
        shell: bash
        run: go test -bench=. -benchmem ./...


  # ---------------------------------------------------------------------------
  # contrib/* submodules (ADR-0003, ADR-0040). Each carries its own go.mod, and
  # `go test ./...` from the repository root does NOT descend into a nested module
  # — so without this job the submodules would never be built or tested at all.
  # One matrix entry per module, so a failure names which one.
  # ---------------------------------------------------------------------------
  contrib:
    name: contrib / ${{ matrix.module }}
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        module: [redishealth, pgxhealth]
    defaults:
      run:
        working-directory: contrib/${{ matrix.module }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with: { go-version: '1.26', cache: true }

      - name: Build, vet and test under the race detector
        run: |
          go build ./...
          go vet ./...
          go test -race ./...

      - name: gofumpt
        run: go install mvdan.cc/gofumpt@v0.10.0 && test -z "$(gofumpt -l .)"

      # contrib/.golangci.yml shadows the root config here: the root's depguard
      # rules forbid driver imports, which is exactly what a contrib module is for.
      - uses: golangci/golangci-lint-action@ba0d7d2ec06a0ea1cb5fa41b2e4a3ab91d21278a # v9.3.0
        with:
          working-directory: contrib/${{ matrix.module }}

      - name: govulncheck
        run: go install golang.org/x/vuln/cmd/govulncheck@v1.4.0 && govulncheck ./...

  # ---------------------------------------------------------------------------
  # examples/* modules (ADR-0054). Same reasoning as the contrib job above and a
  # separate job rather than a matrix entry on it: `contrib / <module>` is a
  # required status check on master, and renaming a required context leaves the
  # branch waiting forever for a check that no longer reports.
  #
  # An example service is documentation, so the bar is that it *runs*: build, vet
  # and a race-detector test run, because a directory of Go files that only
  # compiles proves nothing — the same trap ADR-0053's verified `// Output:` rule
  # closes for Example functions. Coverage is deliberately not gated here; see
  # tools/coverage_gate.py and ADR-0054 for why.
  # ---------------------------------------------------------------------------
  examples:
    name: examples / ${{ matrix.module }}
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        module: [service]
    defaults:
      run:
        working-directory: examples/${{ matrix.module }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with: { go-version: '1.26', cache: true }

      - name: Build, vet and test under the race detector
        run: |
          go build ./...
          go vet ./...
          go test -race ./...

      # The module requires the released core with no `replace`, so a `go.mod`
      # that resolves only against the working tree must fail here rather than in
      # a consumer's checkout. tools/import_graph_lint.py asserts the absence of
      # the replace; this asserts the require actually resolves from the proxy.
      - name: Verify the module is tidy against the released core
        run: |
          go mod tidy -diff
          go mod verify

      - name: gofumpt
        run: go install mvdan.cc/gofumpt@v0.10.0 && test -z "$(gofumpt -l .)"

      # examples/.golangci.yml shadows the root config here: the root's depguard
      # rules forbid a package importing its siblings, which is exactly what a
      # composition example exists to do.
      - uses: golangci/golangci-lint-action@ba0d7d2ec06a0ea1cb5fa41b2e4a3ab91d21278a # v9.3.0
        with:
          working-directory: examples/${{ matrix.module }}

      - name: govulncheck
        run: go install golang.org/x/vuln/cmd/govulncheck@v1.4.0 && govulncheck ./...

  # ---------------------------------------------------------------------------
  # Coverage gate (spec v2 §7, ADR-0036) — 85% of statements *per package*, so the
  # threshold binds the weakest package instead of being absorbed by an average.
  # ---------------------------------------------------------------------------
  coverage:
    name: coverage / 85% per package
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with: { go-version: '1.26', cache: true }
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.12'
      - name: Enforce the per-package coverage floor
        run: python tools/coverage_gate.py

  # ---------------------------------------------------------------------------
  # Import-graph gate (spec v2 §3, ADR-0004/ADR-0035). depguard enforces the rings
  # and the layered graph per file inside the `quality` job; this asserts the same
  # policies over the *resolved* graph, which additionally catches a new direct
  # module requirement and a blank sibling import that depguard does not report.
  # ---------------------------------------------------------------------------
  imports:
    name: imports / dependency rings + layer graph + spec surface
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with: { go-version: '1.26', cache: true }
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.12'
      - name: Assert the dependency rings and internal import graph
        run: python tools/import_graph_lint.py

      # Spec section 5 enumerates the public interface and its closing clause binds
      # SemVer to the exported surface, so the two must agree. Lives in this job
      # because, like the import graph, it needs the Go toolchain to read the real
      # surface (ADR-0043).
      - name: Assert spec section 5 matches the exported surface
        run: python tools/spec_api_lint.py

      # Supply chain (ADR-0056). release.yml attaches a CycloneDX SBOM to the tag, and a
      # generator whose first execution is a release is a generator nobody has run — the
      # weakness ADR-0055 had to admit about contrib-release.yml. The same command therefore
      # runs on every pull request, where the two properties the release depends on are
      # asserted rather than assumed: the document describes THIS module, and `-noserial
      # -notimestamp` really do make it byte-reproducible. Lives in this job because the
      # SBOM *is* the dependency graph, which is what this job already gates.
      - name: Generate the module SBOM and assert it is reproducible
        shell: bash
        run: |
          go install github.com/CycloneDX/cyclonedx-gomod/cmd/cyclonedx-gomod@v1.10.0
          gen() {
            cyclonedx-gomod mod -json -type library -output-version 1.6 \
              -noserial -notimestamp -output "$1" .
          }
          gen "$RUNNER_TEMP/sbom.cdx.json"
          gen "$RUNNER_TEMP/sbom.again.json"

          # Two runs of the same tree must be identical, or the release attaches a document
          # that cannot be re-derived from the tag it names.
          cmp "$RUNNER_TEMP/sbom.cdx.json" "$RUNNER_TEMP/sbom.again.json"

          # Derived from go.mod rather than written down, so the check cannot rot when the
          # module path changes (it already changed once, at /v2).
          want="$(go list -m)"
          got="$(jq -r '.metadata.component.name' "$RUNNER_TEMP/sbom.cdx.json")"
          if [ "$got" != "$want" ]; then
            echo "SBOM describes '$got' but the main module is '$want'" >&2
            exit 1
          fi
          test "$(jq -r '.metadata.component.type' "$RUNNER_TEMP/sbom.cdx.json")" = library
          test "$(jq '.components | length' "$RUNNER_TEMP/sbom.cdx.json")" -ge 1
          jq -r '"\(.metadata.component.name): \(.components | length) runtime component(s)"' \
            "$RUNNER_TEMP/sbom.cdx.json" >> "$GITHUB_STEP_SUMMARY"

  # ---------------------------------------------------------------------------
  # Fuzzing gate (spec v2 §7) — the 10-minute PR budget, split evenly between the
  # two targets. `-fuzz` accepts one target per invocation, so these are two runs
  # of 5 minutes rather than one of ten.
  #
  # Seed corpora under each package's testdata/fuzz/ are committed and also run by
  # the ordinary `go test` in the build job, so a previously found input is a
  # permanent regression test whether or not this job is reached.
  # ---------------------------------------------------------------------------
  fuzz:
    name: fuzz / 10-minute budget
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with: { go-version: '1.26', cache: true }

      - name: Fuzz the config loader
        run: go test ./pkg/config/ -run '^$' -fuzz FuzzConfigLoader -fuzztime 5m

      - name: Fuzz the validator tag grammar
        run: go test ./pkg/validator/ -run '^$' -fuzz FuzzValidatorTags -fuzztime 5m

      # A crash makes the fuzzer write its reproducer to testdata/fuzz/<Target>/.
      # Without this the file dies with the runner and the failure is unreproducible,
      # so the artifact is what turns a red run into a committable regression test.
      - name: Upload fuzz reproducers
        if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: fuzz-reproducers
          path: '**/testdata/fuzz/**'
          if-no-files-found: ignore

  # Data-race / concurrency gate — runs only when the project exposes concurrency.
  race:
    name: race / data-race detector
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with: { go-version: '1.26', cache: true }
      - run: go test -race ./...

