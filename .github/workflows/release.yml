name: release

# Release workflow for egl-utils-go, generated by EADOS.
# Fires on an annotated SemVer tag push and prepares a *draft* GitHub Release. Publishing is
# the deliberate human checkpoint (AGENTS.md §11 / docs/workflow/release.md) — this workflow
# never publishes, it only drafts so a maintainer can review and press "Publish".

on:
  push:
    tags: ["v*.*.*"]

# Nothing at the workflow level. `contents: write` used to live here, which meant any job
# added to this file later would have inherited the one write token in the repository
# without anyone deciding to give it one. The scope now sits on the single job that needs
# it (ADR-0056).
permissions: {}

# Serialize per-tag, but NEVER cancel an in-flight release — a half-run publish is worse
# than a queued one.
concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  draft-release:
    name: draft GitHub Release for ${{ github.ref_name }}
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    permissions:
      contents: write      # create the draft Release and attach the SBOM to it
      id-token: write      # OIDC token the attestation is signed against
      attestations: write  # record the provenance attestation for this repository
    steps:
      - name: Check out the tagged tree
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          # A literal, because this job has no matrix. See the identical fix in ci.yml's
          # benchmark job: `matrix.toolchain` here was undefined and silently resolved to
          # '1.26', so the release's Go version was decided by a dead expression.
          go-version: '1.26'
          cache: true

      - name: Build (verify the tag builds clean)
        shell: bash
        run: go build ./...

      # The SBOM is this project's first release artifact — until now `release.md` step 10
      # promised attached artifacts and every release had none. Flags are decided in
      # ADR-0056: `-type library` because the default `application` is false for a module
      # nobody runs; no `-test`, so the inventory is the three modules a consumer actually
      # links rather than the eight this repository's own suite needs; `-noserial
      # -notimestamp`, which makes the document byte-reproducible from the tag (asserted on
      # every pull request by ci.yml's imports job); and no `-licenses`, because the
      # detector is measurably wrong about all three.
      - name: Generate the SBOM
        shell: bash
        run: |
          go install github.com/CycloneDX/cyclonedx-gomod/cmd/cyclonedx-gomod@v1.10.0
          cyclonedx-gomod mod -json -type library -output-version 1.6 \
            -noserial -notimestamp \
            -output "egl-utils-go-${GITHUB_REF_NAME}.cdx.json" .

      # Binds the SBOM's digest to this workflow, this repository and this commit, so a
      # consumer can tell the document apart from one somebody else attached. It does NOT
      # claim provenance for the module a consumer resolves — that claim belongs to
      # sum.golang.org, and ADR-0056 refuses to imply otherwise.
      #
      # `actions/attest` rather than `actions/attest-build-provenance`: as of v4 the latter
      # is a composite wrapper that does nothing but forward these inputs to this action,
      # and its own release notes say new implementations should come straight here. With
      # only `subject-path` set this is SLSA build provenance, which is the wrapper's whole
      # behaviour.
      #
      # `create-storage-record: false` is explicit rather than defaulted. Its default is
      # true *and* it requires `push-to-registry`, which is false here — an ambiguity whose
      # only consequence would be needing an `artifact-metadata: write` scope this job does
      # not have. Since a tag is the earliest this step can ever run (roadmap 14.12), the
      # ambiguity is settled here rather than discovered during a release.
      - name: Attest the SBOM's provenance
        uses: actions/attest@a1948c3f048ba23858d222213b7c278aabede763 # v4.1.1
        with:
          subject-path: egl-utils-go-${{ github.ref_name }}.cdx.json
          create-storage-record: false

      - name: Draft the release (a human publishes it)
        uses: softprops/action-gh-release@3d0d9888cb7fd7b750713d6e236d1fcb99157228 # v3.0.2
        with:
          draft: true
          generate_release_notes: true
          files: egl-utils-go-${{ github.ref_name }}.cdx.json
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
