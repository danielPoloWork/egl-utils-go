# Dependabot for egl-utils-go (generated by EADOS).
# Keeps GitHub Actions and language dependencies current. Each update opens a PR that goes
# through the normal review/CI flow — Dependabot proposes, the maintainer merges.
version: 2
updates:
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
    commit-message:
      prefix: "ci"
    labels: ["ci"]
  - package-ecosystem: "gomod"
    directory: "/"
    schedule:
      interval: "weekly"
    commit-message:
      prefix: "build"
    labels: ["build"]
  # Each contrib/* submodule has its own go.mod, and Dependabot only watches the
  # directories listed here — a nested module is invisible to the "/" entry above.
  # These carry the driver dependencies the core is forbidden (ADR-0040), so they
  # are the ones most in need of watching.
  - package-ecosystem: "gomod"
    directory: "/contrib/redishealth"
    schedule:
      interval: "weekly"
    commit-message:
      prefix: "build"
    labels: ["build", "contrib"]
  - package-ecosystem: "gomod"
    directory: "/contrib/pgxhealth"
    schedule:
      interval: "weekly"
    commit-message:
      prefix: "build"
    labels: ["build", "contrib"]
  # examples/service is also its own module (ADR-0054) and equally invisible to the
  # "/" entry. Its one requirement is the core itself, so what Dependabot does here
  # is keep the showcase pinned to the newest *released* core — which is the whole
  # point of forbidding a replace: the demo has to name a version, and a named
  # version goes stale unless something watches it.
  #
  # No "examples" label: only the labels in .github/labels.yml exist on the
  # repository, and Dependabot fails the whole label step when one is missing.
  - package-ecosystem: "gomod"
    directory: "/examples/service"
    schedule:
      interval: "weekly"
    commit-message:
      prefix: "build"
    labels: ["build"]
