blank_issues_enabled: false
contact_links:
  - name: Security vulnerability (private)
    url: https://github.com/danielPoloWork/egl-utils-go/security/advisories/new
    about: Report privately via a security advisory — never as a public issue. See SECURITY.md.
  - name: Code of Conduct concern (private)
    url: https://github.com/danielPoloWork/egl-utils-go/security/advisories/new
    about: >-
      Report privately via the same form, starting the report with "Code of Conduct".
      It is the only private authenticated channel here — see CODE_OF_CONDUCT.md.
  - name: Question, idea, or a capability proposal
    url: https://github.com/danielPoloWork/egl-utils-go/discussions
    about: >-
      Use Discussions for questions, help, and proposals for new capability — a feature
      issue goes stale, a proposal with a trigger does not. See CONTRIBUTING.md §7.
  - name: How to contribute
    url: https://github.com/danielPoloWork/egl-utils-go/blob/master/CONTRIBUTING.md
    about: Setup, the four policy tools that run before the PR, and when a change needs an ADR.
